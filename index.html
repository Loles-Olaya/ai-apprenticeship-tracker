<style>
  :root{
    --primary:#2D3748; --secondary:#4A5568; --accent:#F56565;
    --bg:#F7FAFC; --text:#1A202C; --card:#FFFFFF; --border:#E2E8F0;
    --green:#2F855A; --greenbg:#F0FFF4; --amber:#B7791F; --amberbg:#FFFBEB;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);}
  header{background:var(--primary);color:#fff;padding:22px 28px;}
  header h1{margin:0 0 4px;font-size:22px;font-weight:600;}
  header p{margin:0;color:#CBD5E0;font-size:13px;}
  nav{display:flex;flex-wrap:wrap;background:var(--secondary);position:sticky;top:0;z-index:10;}
  nav button{background:none;border:none;color:#EDF2F7;padding:12px 16px;font-size:13px;cursor:pointer;border-bottom:3px solid transparent;}
  nav button.active{border-bottom:3px solid var(--accent);font-weight:600;background:rgba(255,255,255,.07);}
  nav button:hover{background:rgba(255,255,255,.08);}
  main{max-width:1000px;margin:0 auto;padding:20px 24px 60px;}
  section{display:none;}
  section.active{display:block;}
  h2{font-size:19px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-top:0;}
  h3{font-size:15px;color:var(--primary);margin:22px 0 8px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 18px;margin-bottom:14px;}
  .muted{color:var(--secondary);font-size:13px;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#EDF2F7;color:var(--secondary);margin-right:6px;}
  .badge-ksb{background:#FFF5F5;color:#C53030;}
  .badge-mod{background:#EBF8FF;color:#2B6CB0;}
  .badge-done{background:var(--greenbg);color:var(--green);}
  .badge-wip{background:var(--amberbg);color:var(--amber);}
  input[type=text],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;}
  th{background:#EDF2F7;color:var(--primary);font-weight:600;}
  .term{font-weight:600;color:var(--primary);}
  .flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px;text-align:center;flex:1;min-width:120px;cursor:pointer;transition:border-color .15s, transform .1s;}
  .stat:hover{border-color:var(--accent);}
  .stat:active{transform:scale(0.98);}
  .stat .num{font-size:24px;font-weight:700;color:var(--accent);}
  .stat .lab{font-size:12px;color:var(--secondary);}
  .toverify{background:var(--amberbg);border:1px solid #F6E05E;border-radius:8px;padding:14px 18px;margin-bottom:14px;}
  .toverify li{margin-bottom:8px;}
  ul{padding-left:20px;}
  button.btn{background:var(--primary);color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:12px;cursor:pointer;}
  button.btn:hover{background:var(--secondary);}
  .imgwrap{text-align:center;margin:14px 0;}
  .imgwrap img{max-width:100%;border:1px solid var(--border);border-radius:6px;}
  .searchbar{margin-bottom:16px;}
  .small{font-size:12px;color:var(--secondary);}
  .glossary-source{float:right;}
</style>
</head>

const GLOSSARY = [
  {term:"Robotic Process Automation (RPA)", def:"Software that mimics human actions on a computer interface (clicking, copying, pasting) to automate repetitive tasks. It follows fixed rules and cannot handle unexpected variation.", src:"Module 1, Unit 1 / My own glossary"},
  {term:"Large Language Model (LLM)", def:"An AI model trained on enormous amounts of text that can understand and generate human language. It works by predicting the most useful next word or phrase given the context it has been provided.", src:"Module 1, Unit 1 / My own glossary"},
  {term:"Hallucination", def:"When a GenAI model generates information that sounds plausible and confident but is factually incorrect. The model does not know it is wrong — it has no way of knowing.", src:"Module 1, Unit 1 / My own glossary"},
  {term:"AI Agent", def:"An AI system that can take sequences of actions to achieve a goal, using tools (search, code execution, API calls) and making intermediate decisions. It operates with more autonomy than a single-turn GenAI model.", src:"Module 1, Unit 1 / My own glossary"},
  {term:"Human-in-the-loop (HITL)", def:"A design principle / supervision model in which human review, approval, or correction is built into an AI-enabled process at defined points. The AI proposes; the human decides before anything downstream happens. Most intensive form of oversight — costs throughput but is appropriate where errors carry significant consequence.", src:"Module 1, Unit 1 · Module 2, Unit 1 / My own glossary"},
  {term:"Human-on-the-loop", def:"A supervision model where the AI acts autonomously, but a human monitors outputs and can intervene to override or correct them. More efficient than human-in-the-loop, but only real oversight if the monitor genuinely has time, clear signals, and authority to act.", src:"Module 2, Unit 1"},
  {term:"Human-out-of-the-loop", def:"The AI acts fully autonomously with no live human involvement. Appropriate for low-stakes, high-volume, easily reversible actions; inappropriate where actions are irreversible or errors are consequential.", src:"Module 2, Unit 1"},
  {term:"Automation bias", def:"The tendency for people to over-rely on automated systems, accepting their outputs without applying the judgement or verification they would apply to the same information from a human source.", src:"Module 2, Unit 1"},
  {term:"Fine-tuning", def:"Taking a general LLM and training it further on a specific dataset (e.g. a company's internal documents) so it performs better on that domain or style. More resource-intensive than standard deployment, but can significantly improve relevance and accuracy for specialist use cases.", src:"My own glossary"},
  {term:"Embeddings", def:"A way of representing meaning numerically so that similar concepts can be found mathematically. Foundational to search and retrieval systems that connect GenAI to specific knowledge bases.", src:"My own glossary"},
  {term:"Retrieval-Augmented Generation (RAG)", def:"A technique where a GenAI model is connected to a knowledge base and retrieves relevant documents at the moment of a query, using them to generate a more accurate, grounded response. Widely used in enterprise AI as a way of reducing hallucination risk.", src:"My own glossary"},
  {term:"Sentiment analysis", def:"The process of reading a piece of text and determining the emotional tone behind it — typically classifying it as positive or negative. One of the most established business applications of AI: the model reads comments at scale and returns a structured judgement on each.", src:"My own glossary"},
  {term:"AI Builder", def:"Microsoft's no-code AI capability built into the Power Platform. Lets you use AI models — including LLMs — directly inside Power Automate flows without writing code. The \"Run a prompt\" action sends text to an AI model and returns a generated response. Runs on Copilot credits — check licensing before building.", src:"Module 1, Unit 2 / My own glossary"},
  {term:"Value Stream Mapping (VSM)", def:"Originated in lean manufacturing (Toyota Production System). Where a process map asks \"what happens and who does it?\", VSM asks a broader question: across the entire end-to-end flow, where is value created, and where is time/effort consumed without adding value? Captures process steps, data flows, wait times, cycle times, and value vs waste. More strategic than process mapping — used to prioritise where to focus, not to design a specific automation. For apprenticeship project work, process mapping is the right tool; VSM is out of scope but useful context.", src:"Module 1, Unit 3 / My own glossary"},
];

/* ---- Modules ---- */
function renderModules(){
  let h=`<h2>Modules &amp; units</h2>`;
  MODULES.forEach(m=>{
    h+=`<div class="card"><h3 style="margin-top:0">${m.mod} <span class="badge ${m.status==='done'?'badge-done':'badge-wip'}">${m.status==='done'?'complete':'in progress'}</span></h3>`;

      h+=`<div style="margin:12px 0;padding:10px 12px;background:${u.status==='done'?'var(--greenbg)':'var(--amberbg)'};border-radius:6px;">

        <div>${u.ksbs.map(k=>`<span class="badge badge-ksb">${k}</span>`).join('')}</div>
      </div>`;
    });
    h+=`</div>`;
  });
  return h;
}

/* ---- Glossary ---- */
function renderGlossary(){
  return `
  <h2>Glossary</h2>
  <div class="searchbar"><input type="text" id="glossarySearch" placeholder="Search terms..." oninput="filterGlossary()"></div>
  <div id="glossaryList"></div>`;
}
function filterGlossary(){
  const q=(document.getElementById('glossarySearch').value||'').toLowerCase();
  const list=document.getElementById('glossaryList');
  const items=GLOSSARY.filter(g=>g.term.toLowerCase().includes(q)||g.def.toLowerCase().includes(q));
  list.innerHTML=items.map(g=>`
    <div class="card">
      <span class="badge glossary-source">${g.src}</span>
      <div class="term">${g.term}</div>
      <div class="small" style="margin-top:4px;line-height:1.5;">${g.def}</div>
    </div>`).join('') || '<p class="muted">No matches.</p>';
}

}

  <table>
    <tr><th>Code</th><th>Description</th><th>Where it appears</th></tr>
    ${KSB_MAP.map(k=>`<tr><td><span class="badge badge-ksb">${k.code}</span></td><td>${k.desc}</td><td class="small">${k.where}</td></tr>`).join('')}
  </table>`;
}

/* ---- OTJ ---- */
function renderOtj(){
  const total=state.otj.reduce((s,e)=>s+(parseFloat(e.hours)||0),0);
  return `<h2>Off-the-job (OTJ) hours log</h2>
  <p class="muted">Target: 420 hours. Carried over from the original tracker build (May 2026 entries) — see <b>To verify</b> regarding the gap since then.</p>
  <div class="stat" style="max-width:200px;margin-bottom:14px;"><div class="num">${total}</div><div class="lab">hours logged</div></div>
  <table>
    <tr><th>Date</th><th>Description</th><th>Hours</th><th>KSBs</th></tr>
    ${state.otj.map(e=>`<tr><td>${e.date}</td><td>${e.desc}</td><td>${e.hours}</td><td>${(e.ksbs||[]).map(k=>`<span class="badge badge-ksb">${k}</span>`).join('')}</td></tr>`).join('')}
  </table>
  <h3>Add an entry</h3>
  <div class="card">
    <div class="flex">
      <input type="text" id="otjDate" placeholder="YYYY-MM-DD" style="max-width:140px;">
      <input type="text" id="otjHours" placeholder="Hours" style="max-width:80px;">
      <input type="text" id="otjKsbs" placeholder="KSBs, comma separated" style="max-width:180px;">
    </div>
    <textarea id="otjDesc" placeholder="Description" style="margin-top:8px;" rows="2"></textarea>
    <button class="btn" style="margin-top:8px;" onclick="addOtj()">Add entry</button>
  </div>`;
}
function addOtj(){
  const date=document.getElementById('otjDate').value.trim();
  const hours=parseFloat(document.getElementById('otjHours').value);
  const desc=document.getElementById('otjDesc').value.trim();
  const ksbs=document.getElementById('otjKsbs').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(!date||!desc||!hours){alert('Please fill in date, description and hours.');return;}
  state.otj.push({date,desc,hours,ksbs});
  state.otj.sort((a,b)=>a.date.localeCompare(b.date));
  save();
  renderAll();
  showTab('otj');
}

/* ---- Evidence ---- */
function renderEvidence(){
  return `<h2>Portfolio evidence</h2>
  ${PORTFOLIO_EVIDENCE.map(e=>`
    <div class="card">
      <div class="term">${e.title}</div>
      <p class="small" style="line-height:1.6;">${e.desc}</p>
      ${e.img?'<div class="imgwrap"><img src="patorg_enhancement_swimlane.png" alt="PatOrg enhancement swimlane"></div>':''}
    </div>`).join('')}`;
}

/* ---- Notes ---- */
function renderNotes(){
  return `<h2>My notes &amp; prompts</h2>
  <h3>Prompt library (from My_own_glossary.xlsx)</h3>
  <table>
    <tr><th>Purpose</th><th>Prompt</th></tr>
    ${PROMPTS.map(p=>`<tr><td>${p.purpose}</td><td class="small">${p.prompt}</td></tr>`).join('')}
  </table>
  <h3>Free notes</h3>
  <div class="card">
    <textarea id="freeNotes" rows="6" placeholder="Anything else worth keeping here...">${state.notes||''}</textarea>
    <button class="btn" style="margin-top:8px;" onclick="saveNotes()">Save notes</button>
  </div>
  <p class="muted">Workbook activity answers (your own draft input/feedback in each unit workbook) were kept out of this tracker deliberately — they're working answers, not confirmed evidence text. Say the word if you'd like a dedicated "draft answers" section added per unit.</p>`;
}
function saveNotes(){
  state.notes=document.getElementById('freeNotes').value;
  save();
}

/* ---- Verify ---- */
function renderVerify(){
  return `<h2>To verify with you</h2>
  <div class="toverify"><ul>${TOVERIFY.map(v=>`<li>${v}</li>`).join('')}</ul></div>`;
}

/* ---- Sources ---- */
function renderSources(){
  return `<h2>Sources &amp; update log</h2>
  <p class="muted">Every time new material is uploaded and folded in, add a row here with the date — this is how you'll know what's been included and what still needs a top-up.</p>
  <table>
    <tr><th>File</th><th>What it contributed</th><th>Date included</th></tr>
    ${SOURCES.map(s=>`<tr><td>${s.file}</td><td class="small">${s.note}</td><td>${s.date}</td></tr>`).join('')}
  </table>
  <p class="small" style="margin-top:10px;"><b>Last full update:</b> ${LAST_UPDATE}</p>`;
}

function renderAll(){
  main.innerHTML='';
  const sections={
    overview:renderOverview, modules:renderModules, glossary:renderGlossary,
    frameworks:renderFrameworks, ksb:renderKsb, otj:renderOtj,
    evidence:renderEvidence, notes:renderNotes, verify:renderVerify, sources:renderSources
  };
  TABS.forEach(t=>{
    const s=document.createElement('section');
    s.id=t.id;
    s.innerHTML=sections[t.id]();
    main.appendChild(s);
  });
  filterGlossary();
  showTab('overview');
}
renderAll();
</script>
</body>
</html>
